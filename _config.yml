title: DEFORM V14.0.2 Manual
description: Documentation for DEFORM V14.0.2 metal-forming simulation software.
baseurl: "/deform-manual"   # GitHub Pages repo path — adjust if repo name differs
url: "https://martinnecpal.github.io"

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: "_docs"
      type: docs
    values:
      layout: topic

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude build/tooling files from the site output
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - scripts/
  - "*.ppf"
  - parentdata.js
  - screendata.js
  - projectdata.js
  - index.ppf
  # Legacy RoboHelp sites (content served from _docs/en/ and _docs/sk/ instead)
  - en/documentation_content/
  - en/whxdata/
  - en/template/
  - en/index.html     # replaced by index.md
  - sk/documentation_content/
  - sk/whxdata/
  - sk/template/
  - sk/index.html     # replaced by sk/index.md
  - sk/assets/        # duplicate of root assets/

# Keep assets untouched
keep_files:
  - assets

sass:
  style: compressed
